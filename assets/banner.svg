<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dynamic Flow Pulse -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f1f5f9;
    }
    .node-subtext {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 10px;
      fill: #64748b;
    }
    
    /* Subtle Dynamic Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseRing {
      0% { r: 18px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 32px; opacity: 0; stroke-width: 0.5px; }
    }

    .animated-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .animated-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .flow-path {
      stroke-dasharray: 8 6;
      animation: flowLine 12s linear infinite;
    }
    .float-card-1 {
      animation: floatCard 5s ease-in-out infinite;
    }
    .float-card-2 {
      animation: floatCard 6s ease-in-out infinite 1s;
    }
    .float-card-3 {
      animation: floatCard 5.5s ease-in-out infinite 0.5s;
    }
    .ping-circle {
      animation: pulseRing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <g class="animated-orb-1">
    <circle cx="220" cy="120" r="180" fill="#6366f1" opacity="0.35" filter="url(#heavy-glow)" />
  </g>
  <g class="animated-orb-2">
    <circle cx="980" cy="280" r="200" fill="#ec4899" opacity="0.25" filter="url(#heavy-glow)" />
    <circle cx="850" cy="140" r="140" fill="#06b6d4" opacity="0.2" filter="url(#heavy-glow)" />
  </g>

  <!-- Decorative Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Dynamic Process / Automation Flow Lines in Background -->
  <g opacity="0.65">
    <path class="flow-path" d="M 680,310 C 760,310 770,240 850,240" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <path class="flow-path" d="M 850,240 C 930,240 940,170 1020,170" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-path" d="M 850,240 C 930,240 940,310 1020,310" fill="none" stroke="#f472b6" stroke-width="2.5" />
  </g>

  <!-- Dynamic Orchestration Nodes (Right Side Graphic) -->
  <g class="float-card-1" transform="translate(680, 260)">
    <rect width="130" height="70" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="28" cy="35" r="14" fill="#4338ca" />
    <text x="28" y="40" font-size="14" text-anchor="middle" fill="#fff">⚡</text>
    <text x="52" y="32" class="node-text">Omnichannel</text>
    <text x="52" y="48" class="node-subtext">Unified Ingest</text>
  </g>

  <g class="float-card-2" transform="translate(850, 190)">
    <rect width="130" height="70" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="28" cy="35" r="14" fill="#0284c7" />
    <!-- Dynamic ping ring around AI Brain -->
    <circle cx="28" cy="35" r="18" fill="none" stroke="#38bdf8" class="ping-circle" />
    <text x="28" y="40" font-size="14" text-anchor="middle" fill="#fff">🧠</text>
    <text x="52" y="32" class="node-text">AI Agent Core</text>
    <text x="52" y="48" class="node-subtext">RAG &amp; Reasoning</text>
  </g>

  <g class="float-card-3" transform="translate(1020, 130)">
    <rect width="135" height="65" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="32" r="14" fill="#059669" />
    <text x="28" y="37" font-size="14" text-anchor="middle" fill="#fff">✨</text>
    <text x="50" y="30" class="node-text">Auto-Resolve</text>
    <text x="50" y="45" class="node-subtext">Zero-touch SLA</text>
  </g>

  <g class="float-card-3" transform="translate(1020, 275)">
    <rect width="135" height="65" rx="12" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="28" cy="32" r="14" fill="#be185d" />
    <text x="28" y="37" font-size="14" text-anchor="middle" fill="#fff">👤</text>
    <text x="50" y="30" class="node-text">Human Copilot</text>
    <text x="50" y="45" class="node-subtext">Smart Triage</text>
  </g>

  <!-- Foreground Main Branding & Typography (Crisp and Unobscured) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#22c55e" />
    <text x="32" y="21" class="badge-text" fill="#a5b4fc">🤖 AI &amp; WORKFLOW AUTOMATION</text>

    <!-- Main Title (Gradient Fill with Drop Shadow) -->
    <text x="0" y="85" class="title-text" fill="#ffffff">Customer Support &amp;</text>
    <text x="0" y="140" class="title-text" fill="url(#primary-glow)">Service Automation</text>

    <!-- Subtitle & Description -->
    <text x="0" y="185" class="subtitle-text">Curated Landscape of Enterprise SaaS &amp; Open-Source AI Engines</text>
    <text x="0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">
      Autonomous Agents • Omnichannel Helpdesks • Self-Hosted RAG • Ticket Triage
    </text>

    <!-- Highlighted Metrics / Feature Badges -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: Enterprise SaaS -->
      <g>
        <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">☁️ Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">⚡ Self-Hosted OSS</text>
      </g>
      <!-- Pill 3: Autonomous AI -->
      <g transform="translate(290, 0)">
        <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">🎯 Outcome AI</text>
      </g>
      <!-- Pill 4: GitHub Curated -->
      <g transform="translate(435, 0)">
        <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f472b6">⭐ Awesome List</text>
      </g>
    </g>
  </g>
</svg>
